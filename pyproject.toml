[project]
name = "preen"
description = "Conformance and adoption CLI for the py-canon fleet standard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gaurav Sood", email = "contact@gsood.com" }]
requires-python = ">=3.12"
version = "0.3.1"
keywords = ["packaging", "release", "conformance", "copier", "cli", "python"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.27.0",
    "rich>=13.5",
    "PyYAML>=6.0",
    "copier>=9",
    "tomlkit>=0.13",
    "packaging>=24",
    "ruff>=0.15.21",
    "pyright>=1.1.411",
    "pydoclint>=0.9.1",
    "codespell>=2.4.3",
    "deptry>=0.20",
    # The `links` check shells out to this rather than extracting URLs itself.
    # It is the same checker r-canon runs for the R fleet, so both halves of
    # the fleet agree on what a URL is.
    "lychee-bin>=0.24.2",
]

[project.urls]
Homepage = "https://github.com/gojiplus/preen"
Documentation = "https://gojiplus.github.io/preen/"
Repository = "https://github.com/gojiplus/preen"
"Bug Tracker" = "https://github.com/gojiplus/preen/issues"

[project.scripts]
preen = "preen.cli:run"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "preen"

[dependency-groups]
dev = [
    "pre-commit>=4",
    { include-group = "test" },
    "ruff>=0.14",
    "pyright>=1.1.390",
    "pydoclint>=0.5",
]
test = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]
docs = [
    "sphinx>=8",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: fleet standard (google convention). W191/D206/D300: ruff's docs
# list these as always incompatible with `ruff format`. S603/S607: preen's job
# is driving developer tools (ruff, git, uv, copier) via subprocess.
ignore = ["D203", "D213", "W191", "D206", "D300", "S603", "S607"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF"]
"docs/**" = ["D"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.codespell]
# "Leary" is a surname in the worked example of why auto-fixing spelling in
# data files is unsafe; "sav" is a serialized-model filename extension checked
# by runtime-assets.
ignore-words-list = "leary,sav"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.preen]
src_layout = true
tests_at_root = true
skip_checks = []
